[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "longloopve"
version = "0.1.0"
description = "AIM log ingestion for evidence-based engine VE table corrections"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["libxrk==0.13.0", "pyarrow>=18.1,<24", "numpy>=1.26,<3"]

[project.scripts]
longloopve = "longloopve.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "lz4>=4.3,<5", "defusedxml>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
